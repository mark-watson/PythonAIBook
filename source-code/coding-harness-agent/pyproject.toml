[project]
name = "coding-harness-agent"
version = "0.2.0"
description = "An interactive coding agent with tool use, edit approval, and multi-provider LLM support (Fireworks, MLX)"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{ name = "Mark Watson", email = "markw@markwatson.com" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
coding-agent = "agent:cli_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "agent",
    "approval",
    "chat_loop",
    "fireworks_ai",
    "harness_config",
    "line_input",
    "mlx_serve",
    "search",
    "tools",
]
