[project]
name = "genetic-programming"
version = "0.1.0"
description = "Genetic programming examples for the Python AI Book"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "pyrefly",
  "ruff",
  "pytest",
  "pytest-xdist",
  "pytest-testmon",
  "hypothesis",
  "syrupy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
