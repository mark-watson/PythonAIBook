[project]
name = "reinforcement-learning"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.2.0",
    "numpy>=2.0.0",
    "pymdptoolbox>=4.0b3",
]

[dependency-groups]
dev = [
  "pyrefly",
  "ruff",
  "pytest",
  "pytest-xdist",
  "pytest-testmon",
  "hypothesis",
  "syrupy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
