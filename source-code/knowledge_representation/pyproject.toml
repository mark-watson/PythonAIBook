[project]
name = "knowledge-representation"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "sparqlwrapper>=2.0.0",
]

[dependency-groups]
dev = [
  "pyrefly",
  "ruff",
  "pytest",
  "pytest-xdist",
  "pytest-testmon",
  "hypothesis",
  "syrupy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
