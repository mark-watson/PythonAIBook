[project]
name = "litelm"
version = "0.1.0"
description = "Uniform interface to the LLM providers used in this book (OpenAI, Gemini, Fireworks, NVIDIA, Ollama)"
requires-python = ">=3.14"
dependencies = []

# litelm is a real installable library, not just a folder of scripts: it is a
# build backend declaration away from being a local dependency of any other
# project in this book. `make install` / `make uninstall` wrap the editable
# install; see README.md.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["litelm"]

[dependency-groups]
dev = [
  "pyrefly",
  "ruff",
  "pytest",
  "pytest-xdist",
  "pytest-testmon",
  "hypothesis",
  "syrupy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: calls a real provider (needs a local Ollama server and/or API keys)",
]
addopts = "-m 'not live'"
