[project]
name = "deep-learning-image-generation"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.13.0",
    "diffusers>=0.37.1",
    "invisible-watermark>=0.2.0",
    "litellm",
    "pillow>=12.2.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.6.2",
]

# litellm is the shared LLM/image interface for every example in the book; it
# reaches Imagen through Gemini's native API, so google-genai is not needed.
# See https://github.com/BerriAI/litellm.

[dependency-groups]
dev = [
  "pyrefly",
  "ruff",
  "pytest",
  "pytest-xdist",
  "pytest-testmon",
  "hypothesis",
  "syrupy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
