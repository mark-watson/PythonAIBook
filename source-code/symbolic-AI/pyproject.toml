[project]
name = "symbolic-ai"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "minizinc>=0.10.0",
    "spacy>=3.8.13",
    "swiplserver>=1.0.2",
]

[dependency-groups]
dev = [
  "pyrefly",
  "ruff",
  "pytest",
  "pytest-xdist",
  "pytest-testmon",
  "hypothesis",
  "syrupy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
