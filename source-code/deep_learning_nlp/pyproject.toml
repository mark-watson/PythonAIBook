[project]
name = "deep-learning-nlp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=5.4.1",
    "torch>=2.11.0",
    "transformers>=5.6.2",
]

[dependency-groups]
dev = [
  "pyrefly",
  "ruff",
  "pytest",
  "pytest-xdist",
  "pytest-testmon",
  "hypothesis",
  "syrupy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
