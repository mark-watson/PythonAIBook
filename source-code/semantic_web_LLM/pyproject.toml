[project]
name = "semantic-wem-llm"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "litelm",
    "requests>=2.34.2",
    "sparqlwrapper>=2.0.0",
]

# litelm is the shared LLM interface for every example in the book. The local
# editable install means edits to ../litelm take effect here immediately.
[tool.uv.sources]
litelm = { path = "../litelm", editable = true }

[dependency-groups]
dev = [
  "pyrefly",
  "ruff",
  "pytest",
  "pytest-xdist",
  "pytest-testmon",
  "hypothesis",
  "syrupy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
