[project]
name = "semantic-wem-llm"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "litellm",
    "requests>=2.34.2",
    "sparqlwrapper>=2.0.0",
]

# litellm is the shared LLM interface for every example in the book:
# https://github.com/BerriAI/litellm

[dependency-groups]
dev = [
  "pyrefly",
  "ruff",
  "pytest",
  "pytest-xdist",
  "pytest-testmon",
  "hypothesis",
  "syrupy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
