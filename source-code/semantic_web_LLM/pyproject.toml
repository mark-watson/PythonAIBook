[project]
name = "semantic-wem-llm"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.44.0",
    "requests>=2.34.2",
    "sparqlwrapper>=2.0.0",
]

[dependency-groups]
dev = [
  "pyrefly",
  "ruff",
  "pytest",
  "pytest-xdist",
  "pytest-testmon",
  "hypothesis",
  "syrupy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
