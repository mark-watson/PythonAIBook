[project]
name = "llm-local-models"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "litellm",
]

# litellm is the shared LLM interface for every example in the book; it is
# installed from PyPI and reaches Ollama through the "ollama_chat/" prefix.
# https://github.com/BerriAI/litellm

[dependency-groups]
dev = [
  "pyrefly",
  "ruff",
  "pytest",
  "pytest-xdist",
  "pytest-testmon",
  "hypothesis",
  "syrupy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
