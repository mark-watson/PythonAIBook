[project]
name = "llm-local-models"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "ollama>=0.6.1",
    "openai>=2.32.0",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
  "pyrefly",
  "ruff",
  "pytest",
  "pytest-xdist",
  "pytest-testmon",
  "hypothesis",
  "syrupy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
