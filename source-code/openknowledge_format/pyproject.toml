[project]
name = "openknowledge-format"
version = "0.1.0"
requires-python = ">=3.14"
description = "Open Knowledge Format (OKF) example with local LLM Q&A"
dependencies = [
    # The real litellm (https://github.com/BerriAI/litellm); it routes the
    # "ollama_chat/..." model string to the local Ollama server.
    "litellm",
]

[dependency-groups]
dev = [
  "pyrefly",
  "ruff",
  "pytest",
  "pytest-xdist",
  "pytest-testmon",
  "hypothesis",
  "syrupy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
